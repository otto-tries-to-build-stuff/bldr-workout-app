org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# AGP 9 owns Kotlin compilation ("built-in Kotlin") and rejects the kotlin.sourceSets
# DSL. KSP still uses that DSL to register its generated sources, so the two conflict.
# This is the suppression Google's own error message points to. Room codegen is
# verified end-to-end by the build, not assumed — see AppDatabase compiling.
android.disallowKotlinSourceSets=false
